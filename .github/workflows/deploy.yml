name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # CloudBase 新版 PostgreSQL（题库共享）
          VITE_CLOUDBASE_URL: ${{ secrets.VITE_CLOUDBASE_URL }}
          VITE_CLOUDBASE_ANON_KEY: ${{ secrets.VITE_CLOUDBASE_ANON_KEY }}
          # AI API（可选）
          VITE_AI_API_BASE_URL: ${{ secrets.VITE_AI_API_BASE_URL }}
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
